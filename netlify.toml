[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  REACT_APP_SUPABASE_URL = "https://oscuovpwpzjqtaczsems.supabase.co"

[[redirects]]
  from = "/api/settings"
  to = "https://oscuovpwpzjqtaczsems.supabase.co/functions/v1/settings"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
